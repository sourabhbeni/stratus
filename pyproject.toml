[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stratus"
version = "0.1.0"
description = "AWS misconfiguration scanner: S3 exposure, open security groups, IAM hygiene, CloudTrail, encryption."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Saurabh Beniwal" }]
keywords = ["aws", "security", "misconfiguration", "cis", "audit"]
dependencies = ["boto3>=1.34"]

[project.scripts]
stratus = "stratus.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["stratus*"]
